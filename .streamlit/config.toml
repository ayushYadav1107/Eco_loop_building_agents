# Pin the base theme so the app's starting point is deterministic on any machine.
# Without this, theme.base is None and Streamlit follows the viewer's OS setting,
# which desynchronises Streamlit's own chrome from the dashboard's palette and
# produces unreadable text (dark widget text on a light surface, or vice versa).
# The in-app "Dark theme" toggle restyles everything from this known baseline.
[theme]
base = "light"
primaryColor = "#eb6834"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
